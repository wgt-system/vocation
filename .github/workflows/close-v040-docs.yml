name: Close v0.4.0 documentation

on:
  push:
    branches:
      - release/v0.4.0

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/close_v040_docs.py
      - name: Commit documentation closure
        shell: bash
        run: |
          if git diff --quiet -- docs/01_DOMAIN_VISION.md docs/13_IMPLEMENTATION_PLAN.md docs/INDEX.md; then
            echo "Release documentation already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/01_DOMAIN_VISION.md docs/13_IMPLEMENTATION_PLAN.md docs/INDEX.md
          git commit -m "docs: close v0.4.0 standalone baseline [skip ci]"
          git push origin HEAD:release/v0.4.0
