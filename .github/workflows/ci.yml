name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Generate internal API artifacts for Slice 18
        run: pnpm api:generate
        working-directory: frontend
      - name: Commit generated internal API artifacts on branch push
        if: github.event_name == 'push' && github.ref_name == 'slice18/duplicate-case-resolution'
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/api/openapi.json frontend/src/api/generated.ts; then
            echo "Generated API artifacts already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api/openapi.json frontend/src/api/generated.ts
          git commit -m "chore: regenerate internal API types [skip ci]"
          git push origin HEAD:slice18/duplicate-case-resolution
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm format:check
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm api:check
        working-directory: frontend
