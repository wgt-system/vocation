name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check backend
      - run: uv run ruff format --check backend
      - run: uv run mypy
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm format:check
        working-directory: frontend
      - run: pnpm typecheck
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - run: pnpm api:check
        working-directory: frontend

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend
      - name: Start production-style application and verify local HTTP surface
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ".\.venv\Scripts\python.exe" -ArgumentList "-m", "vocation", "--no-browser", "--port", "8765" -PassThru
          try {
            $health = $null
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/health" -TimeoutSec 2
                break
              }
              catch {
                Start-Sleep -Seconds 1
              }
            }

            if ($null -eq $health) {
              throw "Vocation did not become healthy within 30 seconds."
            }
            if ($health.status -ne "ok" -or $health.service -ne "vocation") {
              throw "Unexpected health response."
            }

            $root = Invoke-WebRequest -Uri "http://127.0.0.1:8765/" -UseBasicParsing -TimeoutSec 5
            if ($root.StatusCode -ne 200) {
              throw "Vocation root returned HTTP $($root.StatusCode)."
            }
          }
          finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Verify development launcher readiness and child cleanup
        shell: pwsh
        run: |
          .\scripts\dev.ps1 -BackendSmokeTest -StartupTimeoutSeconds 30
          uv sync --locked --extra dev
