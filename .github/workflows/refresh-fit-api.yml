name: Refresh fit API artifacts

on:
  push:
    branches:
      - feat/explainable-opportunity-fit

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm api:generate
        working-directory: frontend
      - name: Commit generated API artifacts
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/api/openapi.json frontend/src/api/generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/api/openapi.json frontend/src/api/generated.ts
          git commit -m "chore: refresh fit API artifacts [skip ci]"
          git push origin HEAD:feat/explainable-opportunity-fit
