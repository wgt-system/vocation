name: Format profile UI

on:
  push:
    branches:
      - feat/candidate-search-profiles

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm exec biome format --write src/features/profiles src/App.tsx src/main.tsx
        working-directory: frontend
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet -- frontend/src/features/profiles frontend/src/App.tsx frontend/src/main.tsx; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/features/profiles frontend/src/App.tsx frontend/src/main.tsx
          git commit -m "style: format profile workspace [skip ci]"
          git push origin HEAD:feat/candidate-search-profiles
