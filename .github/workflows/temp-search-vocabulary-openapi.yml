name: Temporary Search Vocabulary Branch Maintenance

on:
  push:
    branches:
      - feat/search-vocabularies

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/search-vocabularies
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run ruff format backend
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm format
        working-directory: frontend
      - run: pnpm api:generate
        working-directory: frontend
      - name: Commit formatter and generated API changes
        shell: bash
        run: |
          git add backend frontend/src
          if git diff --cached --quiet; then
            echo "Branch artifacts are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: format vocabulary changes and refresh OpenAPI"
          git push origin HEAD:feat/search-vocabularies
